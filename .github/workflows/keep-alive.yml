name: Keep Render App Alive

# Keep-alive ping disabled: Render service suspended and moving to Railway
# on:
#   schedule:
#     - cron: '*/10 * * * *'
on:
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://ai-seo-dashboard.onrender.com/api/health)
          echo "Health check HTTP status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: Received HTTP $response, retrying with root URL..."
            curl -s -o /dev/null https://ai-seo-dashboard.onrender.com/
          fi
